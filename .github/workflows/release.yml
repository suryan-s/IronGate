name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/irongate

jobs:
  test:
    name: Test with Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore IronGate.slnx

      - name: Build
        run: dotnet build IronGate.slnx -c Release --no-restore

      - name: Test with Coverage
        run: |
          dotnet test IronGate.slnx -c Release --no-build \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura,opencover \
            DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.CoverletOutputFormat=cobertura,opencover \
            DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.MergeWith=true \
            DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile="**/obj/**,**/bin/**"

      - name: Check Coverage Threshold
        run: |
          # Find coverage file
          COVERAGE_FILE=$(find . -name "coverage.cobertura.xml" -path "*/TestResults/*" | head -1)
          if [ -z "$COVERAGE_FILE" ]; then
            echo "Coverage file not found"
            exit 1
          fi
          
          # Generate report and check threshold
          dotnet tool install -g coverlet.console
          dotnet tool install -g reportgenerator
          reportgenerator -reports:"$COVERAGE_FILE" -targetdir:coverage-report -reporttypes:HtmlInline_AzurePipelines,Badges -verbosity:Error
          
          # Check coverage for IronGate package only (integration tests)
          COVERAGE=$(python3 -c "
import xml.etree.ElementTree as ET
import sys

tree = ET.parse('$COVERAGE_FILE')
root = tree.getroot()

# Find the IronGate package
for package in root.findall('.//package'):
    if package.attrib.get('name') == 'IronGate':
        line_rate = float(package.attrib.get('line-rate', 0))
        print(f'{line_rate*100:.2f}')
        sys.exit(0)

# Fallback to overall coverage
overall_rate = float(root.attrib.get('line-rate', 0))
print(f'{overall_rate*100:.2f}')
")
          echo "IronGate package line coverage: $COVERAGE%"
          
          # Check if coverage meets threshold (50% for integration tests on main package)
          python3 -c "
coverage = float('$COVERAGE')
threshold = 50.0
if coverage < threshold:
    print(f'Coverage {coverage}% is below {threshold}% threshold')
    exit(1)
else:
    print(f'Coverage {coverage}% meets {threshold}% threshold')
"

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
          retention-days: 30

      - name: Upload Coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: "**/coverage.cobertura.xml"
          retention-days: 30

  docker:
    name: Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  nuget:
    name: NuGet Publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore IronGate.slnx

      - name: Pack NuGet package
        run: |
          dotnet pack src/IronGate.AspNetCore/IronGate.AspNetCore.csproj \
            -c Release \
            -o ./artifacts \
            --no-restore \
            -p:PackageVersion=${{ github.ref_name }}

      - name: Upload NuGet package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
          retention-days: 30

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --skip-duplicate