global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'local'
    environment: 'development'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'irongate'
    static_configs:
      - targets: ['localhost:5023']
    metrics_path: '/metrics'

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['localhost:8889']

  - job_name: 'tempo'
    static_configs:
      - targets: ['localhost:3200']

  - job_name: 'loki'
    static_configs:
      - targets: ['localhost:3100']

  - job_name: 'grafana'
    static_configs:
      - targets: ['localhost:3000']

  - job_name: 'keycloak'
    static_configs:
      - targets: ['localhost:8080']

remote_write:
  - url: http://localhost:9090/api/v1/write